services:
  - type: web
    name: snaplink-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: BASE_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
